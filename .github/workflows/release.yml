name: release

# Publishes runkeep to PyPI via Trusted Publishing (OIDC) — no API token, no secrets.
# Manual trigger only. Run it once from the tip of main after CI is green.
on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e .
          python -m compileall src tests
          python -m unittest discover -v
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
