name: demo

# Regenerates demo.gif from demo.tape and commits it back.
# Manual trigger only — run it once after cloning, or whenever demo.tape changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report size
        run: ls -l demo.gif && du -h demo.gif
      - name: Commit demo.gif
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo.gif
          if git diff --cached --quiet; then
            echo "demo.gif unchanged — nothing to commit"
          else
            git commit -m "chore: regenerate demo.gif [skip ci]"
            git push
          fi
